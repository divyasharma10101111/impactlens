services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: sponsorintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A workers.celery_app worker --loglevel=INFO
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./:/app
      - ./reports:/app/reports

  streamlit:
    build: .
    command: streamlit run dashboard/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    env_file: .env
    depends_on:
      - db
    ports:
      - "8501:8501"
    volumes:
      - ./:/app

volumes:
  pgdata:
